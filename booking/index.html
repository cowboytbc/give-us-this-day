<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="GIVE US THIS DAY — Booking enquiries for venues and labels." />
    <title>GIVE US THIS DAY — BOOKING</title>
    <link rel="icon" type="image/png" href="/SIGIL.png" />
    <link rel="preload" href="/LOGO.png" as="image" />
    <link rel="stylesheet" href="/src/booking.css" />
  </head>
  <body>
    <div class="page">
      <a class="back-link" href="/">← BACK</a>

      <header>
        <img src="/LOGO.png" alt="GIVE US THIS DAY" class="logo" />
        <p class="sub">BOOKING ENQUIRIES</p>
      </header>

      <form
        action="https://formspree.io/f/xreovpqw"
        method="POST"
        class="booking-form"
      >
        <div class="field">
          <label for="name">CONTACT NAME</label>
          <input id="name" name="name" type="text" required placeholder="Your name" />
        </div>

        <div class="field">
          <label for="org">ORGANISATION</label>
          <input id="org" name="organisation" type="text" required placeholder="Venue / label / promoter name" />
        </div>

        <div class="field">
          <label for="type">ENQUIRY TYPE</label>
          <select id="type" name="type" required>
            <option value="" disabled selected>Select one</option>
            <option value="Venue">Venue / Show booking</option>
            <option value="Label">Record label</option>
            <option value="Festival">Festival / event</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="email">YOUR EMAIL</label>
          <input id="email" name="email" type="email" required placeholder="your@email.com" />
        </div>

        <div class="field">
          <label for="phone">PHONE <span class="opt">(optional)</span></label>
          <input id="phone" name="phone" type="tel" placeholder="+1 000 000 0000" />
        </div>

        <div class="field">
          <label for="message">DETAILS</label>
          <textarea id="message" name="message" rows="6" required placeholder="Date, venue capacity, offer, or anything else relevant..."></textarea>
        </div>

        <button class="submit-btn" type="submit">SEND ENQUIRY</button>
      </form>

      <footer>GIVE US THIS DAY &copy; 2026 &mdash; giveusthisdayband@gmail.com</footer>
    </div>
  </body>
</html>
