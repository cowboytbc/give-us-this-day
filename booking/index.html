<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="GIVE US THIS DAY — Booking enquiries for venues and labels." />
    <link rel="canonical" href="https://giveusthisday.site/booking/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://giveusthisday.site/booking/" />
    <meta property="og:title" content="GIVE US THIS DAY — Booking" />
    <meta property="og:description" content="Venue and label booking enquiries." />
    <meta property="og:image" content="https://giveusthisday.site/LOGO.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GIVE US THIS DAY — Booking" />
    <meta name="twitter:description" content="Venue and label booking enquiries." />
    <meta name="twitter:image" content="https://giveusthisday.site/LOGO.png" />
    <title>GIVE US THIS DAY | Booking</title>
    <link rel="icon" type="image/png" href="/SIGIL.png" />
    <link rel="preload" href="/LOGO.png" as="image" />
    <link rel="stylesheet" href="/src/booking.css" />
  </head>
  <body>
    <div class="page">
      <a class="back-link" href="/">← BACK</a>

      <header>
        <img src="/LOGO.png" alt="GIVE US THIS DAY" class="logo" />
        <p class="sub">BOOKING ENQUIRIES</p>
      </header>

      <form
        id="booking-form"
        action="https://formspree.io/f/xppwprlj"
        method="POST"
        class="booking-form"
      >
        <input type="hidden" name="_subject" value="New GIVE US THIS DAY booking enquiry" />
        <div class="form-status form-status--error" data-fs-error role="alert"></div>

        <div class="field">
          <label for="name">CONTACT NAME</label>
          <input id="name" name="name" type="text" required placeholder="Your name" data-fs-field />
          <span class="field-error" data-fs-error="name"></span>
        </div>

        <div class="field">
          <label for="org">ORGANISATION</label>
          <input id="org" name="organisation" type="text" required placeholder="Venue / label / promoter name" data-fs-field />
          <span class="field-error" data-fs-error="organisation"></span>
        </div>

        <div class="field">
          <label for="type">ENQUIRY TYPE</label>
          <select id="type" name="type" required data-fs-field>
            <option value="" disabled selected>Select one</option>
            <option value="Venue">Venue / Show booking</option>
            <option value="Label">Record label</option>
            <option value="Festival">Festival / event</option>
            <option value="Other">Other</option>
          </select>
          <span class="field-error" data-fs-error="type"></span>
        </div>

        <div class="field">
          <label for="email">YOUR EMAIL</label>
          <input id="email" name="email" type="email" required placeholder="your@email.com" data-fs-field />
          <span class="field-error" data-fs-error="email"></span>
        </div>

        <div class="field">
          <label for="phone">PHONE <span class="opt">(optional)</span></label>
          <input id="phone" name="phone" type="tel" placeholder="+1 000 000 0000" />
        </div>

        <div class="field">
          <label for="message">DETAILS</label>
          <textarea id="message" name="message" rows="6" required placeholder="Date, venue capacity, offer, or anything else relevant..." data-fs-field></textarea>
          <span class="field-error" data-fs-error="message"></span>
        </div>

        <button class="submit-btn" type="submit" data-fs-submit-btn>SEND ENQUIRY</button>
      </form>

      <footer>GIVE US THIS DAY &copy; 2026 &mdash; giveusthisdayband@gmail.com</footer>
    </div>
    <script type="module" src="/src/booking.js"></script>
  </body>
</html>
