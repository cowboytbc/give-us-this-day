  <body>

    <header>
      <a class="logo" href="#" aria-label="GIVE US THIS DAY home">
        <img src="/SIGIL.png" alt="GIVE US THIS DAY" class="logo-img" />
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">

      <nav id="site-nav" aria-label="Main">

        <a href="#about">ABOUT</a>

    <main>

      <section class="hero" id="home">

          <img src="/LOGO.png" alt="GIVE US THIS DAY" class="hero-logo" />

        <div class="block-label">[ MERCH STORE ]</div>

            <div class="product-img" aria-label="Shirt"></div>

              <h2 class="product-name">LOGO/SIGIL SHIRT</h2>
              <p class="product-price">$24.99</p>
              <div class="size-btns">
                <a class="size-btn" href="https://buy.stripe.com/dRmbJ2gwPaaT8f6dbz2cg02" target="_blank" rel="noopener">S</a>
                <a class="size-btn" href="https://buy.stripe.com/4gM9AUgwP1Enaneb3r2cg00" target="_blank" rel="noopener">M</a>
                <a class="size-btn" href="https://buy.stripe.com/eVqcN694n1Enbri0oN2cg03" target="_blank" rel="noopener">L</a>
                <a class="size-btn" href="https://buy.stripe.com/14AfZi0xRaaT2UM2wV2cg04" target="_blank" rel="noopener">XL</a>
                <a class="size-btn" href="https://buy.stripe.com/14A14ofsLaaTbri2wV2cg05" target="_blank" rel="noopener">XXL</a>
              </div>
            </div>
          </article>

          <article class="product">
            <div class="product-img" aria-label="Snapback"></div>
            <div class="product-info">
              <h2 class="product-name">LOGO SNAPBACK</h2>
              <p class="product-price">$24.99</p>
              <a class="add-btn" href="https://buy.stripe.com/aFafZi6Wffvdcvm7Rf2cg01" target="_blank" rel="noopener">BUY NOW</a>
            </div>
          </article>

        </div>
      </section>

      <section id="music" class="block block--dark stub">
        <div class="block-label">[ MUSIC ]</div>
      </section>

      <section id="shows" class="block stub">
        <div class="block-label">[ SHOWS ]</div>
      </section>

      <section id="about" class="block block--dark stub">
        <div class="block-label">[ ABOUT ]</div>
      </section>

    </main>

    <footer>
      <span>&#169; 2026 GIVE US THIS DAY</span>
      <a href="#home">&#8593; TOP</a>
    </footer>

    <script type="module" src="/src/main.js"></script>
